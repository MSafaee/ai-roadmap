services:
  postgres:
    image: postgres:17
    container_name: schedule-postgres

    environment:
      POSTGRES_DB: schedules
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres_data: